# SCCH Travel Portal — Docker Compose
# Usage: docker compose up -d
# See DOCKER.md for full setup instructions.

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scch-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/config/.env
        required: false          # optional — falls back to defaults if absent
    environment:
      DATABASE_URL: sqlite:////app/data/travel_expenses.db
      UPLOAD_DIR: /app/uploads
      PROJECTS_FILE: /app/config/projects.yaml
      # Override any of the following via backend/config/.env:
      # AD_ENABLED: "false"
      # AD_SERVER: ""
      # AD_DOMAIN: ""
      # AD_BASE_DN: ""
      # AD_BIND_USER: ""
      # AD_BIND_PASSWORD: ""
      # GOOGLE_MAPS_API_KEY: ""
      # VLM_ENABLED: "false"
      # VLM_BASE_URL: ""
      # VLM_API_KEY: ""
      # VLM_MODEL: "default"
    volumes:
      - ./data:/app/data                       # SQLite database file
      - ./uploads:/app/uploads                 # uploaded receipt files
      - ./backend/config:/app/config           # projects.yaml + .env
    networks:
      - scch-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass VITE_ build-args so they are baked into the JS bundle.
        # Set real values in a .env file or via CI/CD build args.
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_AD_ENABLED: ${VITE_AD_ENABLED:-false}
        VITE_VLM_ENABLED: ${VITE_VLM_ENABLED:-false}
    container_name: scch-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - scch-net

networks:
  scch-net:
    driver: bridge

volumes:
  # Named volumes as an alternative to bind mounts (uncomment to use):
  # data:
  # uploads:
